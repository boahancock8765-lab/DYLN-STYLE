<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Rekomendasi Outfit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Cek Rekomendasi Outfit</h1>
        <p>Masukkan data fisikmu untuk mendapatkan saran ukuran terbaik.</p>

        <div class="form-group">
            <label>Tinggi Badan (cm):</label>
            <input type="number" id="tinggi" placeholder="Contoh: 170">
        </div>

        <div class="form-group">
            <label>Berat Badan (kg):</label>
            <input type="number" id="berat" placeholder="Contoh: 65">
        </div>

        <div class="form-group">
            <label>Panjang Alas Kaki (cm):</label>
            <input type="number" id="kaki" placeholder="Contoh: 26">
        </div>

        <button onclick="hitungRekomendasi()">Dapatkan Rekomendasi</button>

        <div id="hasil" class="hasil-container" style="display: none;">
            <h2>Rekomendasi Untukmu:</h2>
            <div class="card">
                <p>Ukuran Baju: <span id="ukuran-baju">-</span></p>
                <p>Ukuran Sepatu: <span id="ukuran-sepatu">-</span></p>
                <p id="saran-tambahan"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
